[package]
name = "rglsl-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Command-line interface of the rglsl Vulkan GLSL to SPIR-V compiler"
repository.workspace = true
keywords = ["shader", "SPIR-V", "GLSL"]
license.workspace = true

rust-version.workspace = true
publish = false

[[bin]]
name = "rglsl"
path = "src/bin/rglsl.rs"
# This _must_ be false, as this conflicts with `rglsl`'s docs.
#
# See https://github.com/gfx-rs/wgpu/issues/4997
doc = false
test = false

[dependencies]
rglsl = { workspace = true, features = [
    "glsl-in",
    "spv-in",
    "spv-out",
    "serialize",
    "deserialize",
    "termcolor",
    "stderr",
    "fs",
] }

bincode = { workspace = true, features = ["serde"] }
rglsl-link.workspace = true
rglsl-pp = { workspace = true, features = ["std"] }
codespan-reporting = { workspace = true, default-features = false, features = [
    "std",
    "termcolor",
] }
env_logger.workspace = true
argh.workspace = true
anyhow = { workspace = true, features = ["std"] }
log.workspace = true

[lints]
workspace = true
