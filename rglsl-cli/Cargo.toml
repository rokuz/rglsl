[package]
name = "rglsl-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Command-line interface of the rglsl Vulkan GLSL to SPIR-V compiler"
repository.workspace = true
keywords = ["shader", "SPIR-V", "GLSL"]
license.workspace = true

rust-version.workspace = true
publish = false

[lib]
name = "rglsl_cli"
path = "src/lib.rs"
doc = false

[[bin]]
name = "rglsl"
path = "src/main.rs"
doc = false
test = false

[dependencies]
rglsl = { workspace = true, features = ["glsl-in", "spv-out"] }
rglsl-link.workspace = true
rglsl-pp = { workspace = true, features = ["std"] }
rspirv.workspace = true

[lints]
workspace = true

[dev-dependencies]
spirv.workspace = true
