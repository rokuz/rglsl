[[divergence]]
name = "dot*EXT"
versions = [460]
verdicts = ["extensions-differ"]
reason = "intentional: integer dot products are core in SPIR-V 1.6, so SPV_KHR_integer_dot_product is not declared"

[[divergence]]
name = "textureFootprintClampNV"
verdicts = ["capabilities-differ"]
reason = "intentional: without implicit derivatives the clamp becomes the explicit level max(lodClamp, 0); glslang emits Lod with MinLod, a combination SPV_NV_shader_image_footprint does not allow"

[[divergence]]
name = "frexp"
signature = "16"
verdicts = ["extensions-differ"]
reason = "intentional: GLSL.std.450 FrexpStruct needs a 32-bit exponent, and a 16-bit one only SPV_AMD_gpu_shader_int16 allows, an AMD-only device extension; rglsl takes the exact 32-bit exponent and converts it to int16"

[[divergence]]
name = "findLSB"
verdicts = ["capabilities-differ"]
reason = "intentional: GLSL.std.450 FindILsb \"is currently limited to 32-bit width components\", so rglsl widens 8- and 16-bit operands and needs no Int8/Int16; glslang emits FindILsb on 16-bit integers"

[[divergence]]
name = "absoluteDifference"
verdicts = ["only-glslang-accepts"]
reason = "bug: the GL_INTEL_shader_integer_functions2 built-ins are not declared"

