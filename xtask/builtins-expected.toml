[[divergence]]
name = "dot*EXT"
versions = [460]
verdicts = ["extensions-differ"]
reason = "intentional: integer dot products are core in SPIR-V 1.6, so SPV_KHR_integer_dot_product is not declared"

[[divergence]]
name = "textureFootprintClampNV"
verdicts = ["capabilities-differ"]
reason = "intentional: without implicit derivatives the clamp becomes the explicit level max(lodClamp, 0); glslang emits Lod with MinLod, a combination SPV_NV_shader_image_footprint does not allow"

[[divergence]]
name = "frexp"
signature = "16"
verdicts = ["extensions-differ"]
reason = "bug: the int16 exponent of frexp is computed in 32 bits through SConvert, glslang uses SPV_AMD_gpu_shader_int16"

[[divergence]]
name = "ldexp"
signature = "16"
verdicts = ["capabilities-differ"]
reason = "bug: the int16 exponent of ldexp is widened through SConvert and the Int16 capability is not declared"

[[divergence]]
name = "findLSB"
verdicts = ["capabilities-differ"]
reason = "bug: 8- and 16-bit findLSB is widened through SConvert and the Int8/Int16 capability is not declared"

[[divergence]]
name = "pack*"
signature = "8vec"
verdicts = ["capabilities-differ"]
reason = "bug: packing of 8- and 16-bit vectors is done with shifts instead of a Bitcast, and the Int8/Int16 capability is not declared"

[[divergence]]
