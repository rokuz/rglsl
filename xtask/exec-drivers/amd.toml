["spv.subgroupArithmetic.comp"]
why = "the AMD proprietary driver (LLPC) crashes while compiling the pipeline, for glslang's module and ours alike; both modules run on NVIDIA and agree there. LGC's lgc-lower-subgroup-ops pass replaces an FMul reduction or scan of a uniform operand over the whole wave with `llvm.powi(x, count)` (count = ctpop(ballot), or mbcnt for scans). For vectors the exponent is splatted to a vector (`llvm.powi.v2f32.v2i32`), which LLVM does not allow, and the scalarizer later reads a null operand (0xC0000005 in amdvlk64.dll); for double the backend cannot select `fpow` on f64 and aborts (0xC0000409); for scalar float the result is wrong (subgroupMul(-3.0) over 8 lanes gives NaN instead of 6561)"

["spv.intrinsicsSpirvDecorate.frag"]
why = "the AMD proprietary driver crashes (0xC0000005 in Amber's process) when a fragment shader reads an input decorated ExplicitInterpAMD, for glslang's module and ours alike: with the input read only through InterpolateAtVertexAMD, or only directly, the pipeline crashes; with the input unused and the gl_BaryCoord*AMD built-ins read, the shader runs. The vertex stage writes the input at its location, and VK_AMD_shader_explicit_vertex_parameter is enabled"

["exec/barycentric_amd_centroid"]
why = "the AMD proprietary driver returns garbage for gl_BaryCoordSmoothCentroidAMD and gl_BaryCoordNoPerspCentroidAMD when the shader also reads the center variant of the same interpolation mode (gl_BaryCoordSmoothAMD or gl_BaryCoordNoPerspAMD), for glslang's module and ours alike. On a single-sampled, fully covered pixel the centroid is the pixel center, so the centroid pair must equal the center pair; at pixel (4, 1) of a triangle covering the framebuffer the center pair is (0.140625, 0.046875) and the centroid pair reads as values like 1.2e-5, -85.27 or 1.4e17 that change from run to run. Read without the center variant (alone or with the sample variant) the centroid pair is correct; the center, sample and pull-model built-ins are correct (exec/barycentric_amd)"

["fuzz/s4_squares_intfunctions/variant_016.frag"]
why = "the AMD proprietary driver (26.10.1, LLPC) crashes (0xC0000005 in Amber's process) at the first draw, for glslang's module and ours alike. Reduced: a texture sample at a coordinate built from an uninitialized vec2, in a branch that never runs, then the coordinate multiplied by a mat2 and `clamp` of the sampled value in another branch; each of the four is needed. The shader is valid (spirv-val) and runs on KosmicKrisp"

["fuzz/s3_colorgrid_modulo_intfunctions/variant_010.frag"]
why = "the AMD proprietary driver (26.10.1, LLPC) hangs on the variant: the device is lost after 7 to 31 s or the fence wait times out, for glslang's module and ours alike, while the reference runs in 0.2 s. The program terminates and is correct: on KosmicKrisp with zero-count bitfield operations fixed, both modules agree with the reference within the macOS fragment watchdog. Replacing the variant's zero-count bitfieldExtract/bitfieldInsert calls by their values does not avoid the hang. A hang resets the GPU, and jobs running next to it on the same machine may time out"
