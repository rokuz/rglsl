["spv.subgroupArithmetic.comp"]
why = "the AMD proprietary driver (LLPC) crashes while compiling the pipeline, for glslang's module and ours alike; both modules run on NVIDIA and agree there. LGC's lgc-lower-subgroup-ops pass replaces an FMul reduction or scan of a uniform operand over the whole wave with `llvm.powi(x, count)` (count = ctpop(ballot), or mbcnt for scans). For vectors the exponent is splatted to a vector (`llvm.powi.v2f32.v2i32`), which LLVM does not allow, and the scalarizer later reads a null operand (0xC0000005 in amdvlk64.dll); for double the backend cannot select `fpow` on f64 and aborts (0xC0000409); for scalar float the result is wrong (subgroupMul(-3.0) over 8 lanes gives NaN instead of 6561)"
