["exec/barycentric_pervertex_block_noperspective"]
why = "the NVIDIA driver returns the value of vertex 0 in every element of a PerVertexKHR input block member that also carries an interpolation decoration (OpMemberDecorate NoPerspective), for glslang's module and ours alike: a pervertexEXT block with a noperspective float member written 10, 20, 30 by the vertex shader reads 10, 10, 10. The same decoration on a PerVertexKHR variable (OpDecorate NoPerspective) reads 10, 20, 30, and so does the block without the member decoration; AMD reads 10, 20, 30 in every case. SPV_KHR_fragment_shader_barycentric and GL_EXT_fragment_shader_barycentric only forbid centroid and sample with pervertexEXT, and both modules pass spirv-val"
