["fuzz/s3_mandelbrot_zoom_intfunctions/variant_022.frag"]
why = "the GPU watchdog of macOS kills fragment work after a few tens of milliseconds per invocation (a fragment shader looping 30 million times on one pixel loses the device; a compute shader loops 300 million times), and KosmicKrisp reports it as a lost device. The variant's live code adds about 150 loop iterations to each of up to 1001 Mandelbrot iterations, 16 times per pixel, for glslang's module and ours alike; with the reference's iteration cap lowered to 400 the variant runs and agrees, and the AMD driver drops the dead live code and runs it in 0.4 s"

