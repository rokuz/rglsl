["fuzz/s5_squares/variant_015.frag"]
why = "the Metal compiler miscompiles KosmicKrisp's `while (true)` loops on M4 with macOS 27 and the device is lost, for glslang's module and ours alike. KK_WORKAROUND_2 (emit `for (uint64_t no_crash = 0u; no_crash < UINT64_MAX; ++no_crash)` instead) is disabled on macOS 27 except on M5; with it the variant runs and agrees with its reference. With loop counters added the program terminates in every pixel and renders the reference's image"

