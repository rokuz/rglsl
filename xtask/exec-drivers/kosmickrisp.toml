["fuzz/s5_stable_bubblesort_flag/variant_039.frag"]
why = "the Metal compiler (AGX backend in MTLCompilerService) never finishes compiling the fragment shader, so vkCreateGraphicsPipelines does not return, for glslang's module and ours alike. The 368-line MSL has discard_fragment() inside nested loops with breaks; without the discards it compiles and runs"
