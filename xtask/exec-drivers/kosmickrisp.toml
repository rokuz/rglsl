["spv.subgroupExtendedTypesArithmetic.comp"]
why = "the Metal shader compiler runs out of memory and aborts, for glslang's module and ours alike. KosmicKrisp lowers every subgroup reduction and scan to unrolled shuffles (`.lower_reduce = true` in msl_nir_lower_subgroups.c, 64-bit shuffles split in two), so the shader becomes about 216,000 lines of MSL with 98,000 SSA values, and nir_to_msl.c (predeclare_ssa_values) declares each of them zero-initialized (`T tN = T(0);`). The extra store per value keeps LLVM's PromoteMemToReg off its single-store path, and phi placement over the 344 branches grows to 8-17 GB until MTLCompilerService crashes. Without the initializer the same MSL compiles in 15 s and 549 MB; a KosmicKrisp build without it runs the shader, and both modules then agree byte for byte"
