["fuzz/s5_muller/variant_028.frag"]
why = "KosmicKrisp keeps Private variables in `uchar scratch[N]` without an initializer on macOS 27 (KK_WORKAROUND_1 is disabled there), and the variant reads `GLF_live4obj.numbers[1]`, which is never written: an undefined value in SPIR-V, undefined behavior in MSL. Once dead stores into the same scratch array are removed (rglsl -O, spirv-opt -O on glslang's module), the Metal compiler proves the load uninitialized and the GPU hangs; a KosmicKrisp build that zero-initializes scratch runs all modules and they agree"

["fuzz/s3_stable_mergesort/variant_013.frag"]
why = "KosmicKrisp prints an undefined scalar source as the untyped literal `00` (src_to_msl in nir_to_msl.c; vectors get their type), so `sign(00)`, `cos(00)`, `fract(00)` or `dfdy(00)` is ambiguous between the half and float overloads and the Metal compiler rejects the MSL, for glslang's module and ours alike. The variant passes an uninitialized value to one of them; a KosmicKrisp build that prints `T(0)` compiles it and the variant agrees with its reference"

