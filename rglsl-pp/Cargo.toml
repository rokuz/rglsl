[package]
name = "rglsl-pp"
version.workspace = true
authors = ["rglsl developers"]
edition.workspace = true
rust-version.workspace = true
description = "GLSL preprocessor with #include and source maps for rglsl"
repository.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
readme.workspace = true
exclude = ["tests", "examples", "benches"]

[lib]
name = "rglsl_pp"

[features]
std = []
serialize = ["dep:serde"]
deserialize = ["dep:serde"]

[dependencies]
arrayvec.workspace = true
serde = { workspace = true, features = ["alloc", "derive"], optional = true }
rglsl-types.workspace = true

[[example]]
name = "compare"
required-features = ["std"]

[lints]
workspace = true
