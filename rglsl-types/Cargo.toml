[package]
name = "rglsl-types"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Common types for rglsl"
repository.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
readme = "README.md"
exclude = ["tests", "examples", "benches"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
serialize = ["dep:serde", "indexmap/serde", "bitflags/serde"]
deserialize = ["dep:serde", "indexmap/serde", "bitflags/serde"]
arbitrary = ["dep:arbitrary", "std", "indexmap/arbitrary", "bitflags/arbitrary"]
std = []

[dependencies]
arbitrary = { workspace = true, features = ["derive"], optional = true }
arrayvec.workspace = true
bitflags.workspace = true
half.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
rglsl-derive.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["alloc", "derive"], optional = true }
stacker.workspace = true
