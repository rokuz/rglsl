[workspace]
resolver = "3"
members = [
    "rglsl",
    "rglsl-types",
    "rglsl-derive",
    "rglsl-test",
    "rglsl-ast",
    "rglsl-sema",
    "rglsl-pp",
    "rglsl-cli",
    "rglsl-dis",
    "rglsl-fuzz",
    "rglsl-link",
    "rglsl-opt",
    "rglsl-capi",
    "rglsl-fuzz/fuzz",
    "xtask",
    "xtask/harness",
    "samples/compile-and-link",
    "samples/link-objects",
]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
ref_as_ptr = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
cloned_instead_of_copied = "warn"
derive_partial_eq_without_eq = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
# NOTE: clippy configuration values (disallowed-types and
# large-error-threshold) are in clippy.toml.

[workspace.package]
edition = "2024"
rust-version = "1.93"
keywords = ["shader", "glsl", "spirv", "vulkan", "compiler"]
categories = ["compilers", "graphics", "rendering::graphics-api"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rokuz/rglsl"
# rglsl started as a hard fork of naga 30.0.0 (gfx-rs/wgpu v30.0.0).
version = "0.1.3"
authors = ["rglsl developers", "gfx-rs developers"]

[workspace.dependencies]
rglsl = { version = "0.1.3", path = "./rglsl" }
rglsl-ast = { version = "0.1.3", path = "./rglsl-ast" }
rglsl-derive = { version = "0.1.3", path = "./rglsl-derive" }
rglsl-dis = { version = "0.1.3", path = "./rglsl-dis" }
rglsl-fuzz = { version = "0.1.3", path = "./rglsl-fuzz" }
rglsl-sema = { version = "0.1.3", path = "./rglsl-sema" }
rglsl-pp = { version = "0.1.3", path = "./rglsl-pp" }
rglsl-link = { version = "0.1.3", path = "./rglsl-link" }
rglsl-opt = { version = "0.1.3", path = "./rglsl-opt" }
rglsl-test = { path = "./rglsl-test" }
rglsl-types = { version = "0.1.3", path = "./rglsl-types" }

anyhow = { version = "1.0.87", default-features = false }
arbitrary = "1.4.2"
arrayvec = { version = "0.7.1", default-features = false }
bit-set = { version = "0.10", default-features = false }
bitflags = "2.9"
cfg_aliases = "0.2.1"
codespan-reporting = { version = "0.13", default-features = false }
env_logger = { version = "0.11", default-features = false }
half = { version = "2.5", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }
indexmap = { version = "2.11.4", default-features = false }
# See https://github.com/rust-fuzz/libfuzzer/issues/126
libfuzzer-sys = ">0.4.0,<=0.4.7"
libm = { version = "0.2.6", default-features = false }
log = "0.4.29"
proc-macro2 = "1.0.95"
quote = "1.0.40"
num-traits = { version = "0.2.16", default-features = false }
rspirv = "0.13"
ron = "0.12"
rustc-hash = { version = "1.1", default-features = false }
serde_json = "1.0.143"
serde = { version = "1.0.225", default-features = false }
spirv = "0.4"
stacker = "0.1.25"
syn = "2.0.104"
toml = "1.0.0"
thiserror = { version = "2.0.12", default-features = false }

[patch.crates-io]
env_logger = { version = "0.11", git = "https://github.com/rust-cli/env_logger.git", rev = "d550741" }

[profile.release]
lto = "thin"
debug = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true

[profile.xtask-release]
inherits = "release"
lto = false
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = true
