[workspace]
resolver = "2"
members = [
    "rglsl",
    "rglsl-types",
    "rglsl-test",
    "rglsl-ast",
    "rglsl-sema",
    "rglsl-pp",
    "rglsl-cli",
    "rglsl-fuzz",
    "rglsl-link",
    "rglsl-fuzz/fuzz",
    "rglsl/xtask",
    "xtask",
]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
ref_as_ptr = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
# NOTE: clippy configuration values (disallowed-types and
# large-error-threshold) are in clippy.toml.

[workspace.package]
edition = "2021"
rust-version = "1.93"
keywords = ["shader", "glsl", "spirv"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rokuz/rglsl"
# rglsl started as a hard fork of naga 30.0.0 (gfx-rs/wgpu v30.0.0). See UPSTREAM.md.
version = "0.1.0"
authors = ["rglsl developers", "gfx-rs developers"]

[workspace.dependencies]
rglsl = { version = "0.1.0", path = "./rglsl" }
rglsl-ast = { version = "0.1.0", path = "./rglsl-ast" }
rglsl-fuzz = { version = "0.1.0", path = "./rglsl-fuzz" }
rglsl-sema = { version = "0.1.0", path = "./rglsl-sema" }
rglsl-pp = { version = "0.1.0", path = "./rglsl-pp" }
rglsl-link = { version = "0.1.0", path = "./rglsl-link" }
rglsl-test = { path = "./rglsl-test" }
rglsl-types = { version = "0.1.0", path = "./rglsl-types" }

anyhow = { version = "1.0.87", default-features = false }
arbitrary = "1.4.2"
arrayvec = { version = "0.7.1", default-features = false }
bincode = "2"
bit-set = { version = "0.10", default-features = false }
bitflags = "2.9"
cfg_aliases = "0.2.1"
cfg-if = "1"
codespan-reporting = { version = "0.13", default-features = false }
diff = "0.1"
env_logger = { version = "0.11", default-features = false }
glob = "0.3"
half = { version = "2.5", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }
indexmap = { version = "2.11.4", default-features = false }
indicatif = "0.18"
itertools = { version = "0.14" }
jobserver = "0.1"
# See https://github.com/rust-fuzz/libfuzzer/issues/126
libfuzzer-sys = ">0.4.0,<=0.4.7"
libm = { version = "0.2.6", default-features = false }
log = "0.4.29"
num_cpus = "1"
num-traits = { version = "0.2.16", default-features = false }
petgraph = { version = "0.8", default-features = false }
pico-args = { version = "0.5", features = [
    "eq-separator",
    "short-space-opt",
    "combined-flags",
] }
rspirv = "0.13"
ron = "0.12"
rustc-hash = { version = "1.1", default-features = false }
serde_json = "1.0.143"
serde = { version = "1.0.225", default-features = false }
shell-words = "1"
spirv = "0.4"
strum = { version = "0.28", default-features = false, features = ["derive"] }
toml = "1.0.0"
thiserror = { version = "2.0.12", default-features = false }
walkdir = "2.3"
which = "8"

[patch.crates-io]
env_logger = { version = "0.11", git = "https://github.com/rust-cli/env_logger.git", rev = "d550741" }

[profile.release]
lto = "thin"
debug = true
