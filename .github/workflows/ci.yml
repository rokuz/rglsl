name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quality gates: fmt, clippy, tests. `unsafe_code` is forbidden through the
  # workspace lints (and `#![forbid(unsafe_code)]` in rglsl), so clippy and the
  # build fail on any unsafe code.
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Runs the glslang corpus against the pinned oracles and checks that the
  # committed PROGRESS.md is what the current code produces.
  corpus:
    name: glslang corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache oracles
        uses: actions/cache@v4
        with:
          path: target/oracles
          key: oracles-${{ runner.os }}-${{ hashFiles('oracles.toml', 'xtask/src/oracles.rs') }}
      - run: cargo xtask oracles --no-exec
      - run: cargo xtask test --no-exec
      - name: PROGRESS.md is up to date
        run: git diff --exit-code PROGRESS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results
          path: target/xtask/results.tsv
