name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: false
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Workspace version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rglsl-capi") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG does not match the workspace version $version"
            exit 1
          fi
      - name: Publish the crates not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          exclude=()
          missing=0
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'rglsl-publish-crates (https://github.com/rokuz/rglsl)' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200)
                echo "$name $version is already on crates.io"
                exclude+=(--exclude "$name")
                ;;
              404)
                echo "$name $version will be published"
                missing=$((missing + 1))
                ;;
              *)
                echo "::error::crates.io answered $status for $name $version"
                exit 1
                ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"')
          if [ "$missing" -eq 0 ]; then
            echo "every crate is already on crates.io"
            exit 0
          fi
          cargo publish --workspace --locked "${exclude[@]}"
