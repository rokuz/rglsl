[package]
name = "rglsl"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A Vulkan GLSL to SPIR-V compiler"
repository.workspace = true
keywords.workspace = true
license.workspace = true
exclude = ["bin/**/*", "tests/**/*", "Cargo.lock", "target/**/*"]
readme = "README.md"
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "rglsl-types/serialize",
]
deserialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "rglsl-types/deserialize",
]
arbitrary = [
    "dep:arbitrary",
    "bitflags/arbitrary",
    "half/arbitrary",
    "half/std",
    "rglsl-types/arbitrary",
]

[dependencies]
rglsl-types = { workspace = true }
rglsl-ast = { workspace = true }
rglsl-pp = { workspace = true }
rglsl-sema = { workspace = true }

arbitrary = { workspace = true, features = ["derive"], optional = true }
arrayvec.workspace = true
bitflags.workspace = true
bit-set.workspace = true
codespan-reporting = { workspace = true }
hashbrown.workspace = true
half = { workspace = true, features = ["num-traits"] }
indexmap.workspace = true
rustc-hash.workspace = true
libm = { workspace = true, default-features = false }
log.workspace = true
num-traits.workspace = true
spirv = { workspace = true }
thiserror.workspace = true
serde = { workspace = true, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
env_logger.workspace = true
hashbrown = { workspace = true, features = ["serde"] }
rglsl-test.workspace = true
ron.workspace = true
rspirv.workspace = true
serde = { workspace = true, features = ["default", "derive"] }

[lints]
workspace = true
