[package]
name = "rglsl"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A Vulkan GLSL to SPIR-V compiler"
repository.workspace = true
keywords = ["shader", "SPIR-V", "GLSL"]
license.workspace = true
exclude = ["bin/**/*", "tests/**/*", "Cargo.lock", "target/**/*"]
readme = "README.md"

rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "rglsl-types/serialize",
]
deserialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "rglsl-types/deserialize",
]
arbitrary = [
    "dep:arbitrary",
    "bitflags/arbitrary",
    "half/arbitrary",
    "half/std",
    "rglsl-types/arbitrary",
]

[dependencies]
rglsl-types = { workspace = true }
rglsl-ast = { workspace = true }
rglsl-pp = { workspace = true }
rglsl-sema = { workspace = true }

arbitrary = { workspace = true, features = ["derive"], optional = true }
arrayvec.workspace = true
bitflags.workspace = true
bit-set.workspace = true
codespan-reporting = { workspace = true }
hashbrown.workspace = true
half = { workspace = true, features = ["num-traits"] }
indexmap.workspace = true
rustc-hash.workspace = true
libm = { workspace = true, default-features = false }
log.workspace = true
num-traits.workspace = true
spirv = { workspace = true }
thiserror.workspace = true
serde = { workspace = true, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
diff.workspace = true
env_logger.workspace = true
hashbrown = { workspace = true, features = ["serde"] }
itertools.workspace = true
rglsl-test.workspace = true
ron.workspace = true
rspirv.workspace = true
serde = { workspace = true, features = ["default", "derive"] }
strum = { workspace = true }
walkdir.workspace = true

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
