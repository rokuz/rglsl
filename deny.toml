[graph]
# Only the library crates matter for licenses, advisories and bans; the tools
# (xtask, rglsl-cli, fuzz targets) are not published.
exclude-unpublished = true
exclude-dev = true

[bans]
multiple-versions = "deny"
skip-tree = [{ name = "rustc-hash", version = "1.1.0" }]
skip = []
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[sources]
allow-git = []
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
